<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭礼金簿 · 完整版</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --surface: #fff; --border: #e2e8f0; --danger: #dc2626; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: var(--bg); height: 100vh; display: flex; }
        .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-weight: 700; font-size: 1.2rem; border-bottom: 1px solid var(--border); }
        .book-list { flex: 1; overflow-y: auto; padding: 12px; }
        .book-item { padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .book-item.active { background: #dbeafe; color: var(--primary); }
        .book-actions button { background: none; border: none; cursor: pointer; opacity: 0.6; }
        .book-item:hover .book-actions button { opacity: 1; }
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .top-bar { padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .btn { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: white; cursor: pointer; font-weight: 500; }
        .btn-primary { background: var(--primary); color: white; border: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; padding: 20px; }
        .stat-card { background: var(--surface); padding: 18px; border-radius: 12px; border: 1px solid var(--border); }
        .expense-panel { background: var(--surface); margin: 0 20px 20px; padding: 16px; border-radius: 12px; border: 1px solid var(--border); }
        .expense-header { display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: 700; }
        .expense-row { display: grid; grid-template-columns: 1fr auto 50px; gap: 12px; padding: 8px 0; border-bottom: 1px dashed #eee; align-items: center; }
        .inline-form { display: grid; grid-template-columns: 1fr 120px auto; gap: 12px; margin-top: 12px; }
        .input { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; }
        .table-wrapper { margin: 0 20px 20px; background: var(--surface); border-radius: 12px; border: 1px solid var(--border); overflow: auto; max-height: 400px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
        .search-box { padding: 8px 12px; border: 1px solid var(--border); border-radius: 20px; width: 240px; }
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-card { background: white; width: 400px; border-radius: 20px; padding: 28px; }
        .error-msg { color: var(--danger); margin-top: 8px; display: none; }
        #excelFileInput { display: none; }
        .empty-hint { text-align: center; padding: 40px; color: #999; }
    </style>
</head>
<body>

<!-- 主界面（直接显示） -->
<div class="sidebar">
    <div class="sidebar-header">📒 我的账本</div>
    <div class="book-list" id="booksContainer"></div>
    <div style="padding:16px; border-top:1px solid var(--border);">
        <button class="btn btn-primary" style="width:100%;" id="newBookBtn">➕ 新建空白账本</button>
    </div>
</div>
<div class="main-content">
    <div class="top-bar">
        <span style="font-size:1.5rem; font-weight:700;" id="currentBookTitle">默认账本</span>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-primary" id="loadEncryptedBtn">🔓 加载加密数据</button>
            <button class="btn" id="importExcelBtn">📂 导入Excel</button>
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 搜索姓名...">
            <button class="btn" id="exportExcelBtn">📤 导出</button>
            <button class="btn" id="analysisBtn">📊 分析</button>
            <button class="btn btn-primary" id="showAddFormBtn">➕ 登记礼金</button>
        </div>
    </div>
    <div style="flex:1; overflow-y:auto;">
        <div class="stats-grid">
            <div class="stat-card"><div style="color:#666;">礼金收入</div><div style="font-size:1.8rem; font-weight:700;" id="totalGift">0</div></div>
            <div class="stat-card"><div style="color:#666;">总支出</div><div style="font-size:1.8rem; font-weight:700;" id="expenseTotal">0</div></div>
            <div class="stat-card"><div style="color:#666;">结余</div><div style="font-size:1.8rem; font-weight:700;" id="balance">0</div></div>
            <div class="stat-card"><div style="color:#666;">宾客数</div><div style="font-size:1.8rem; font-weight:700;" id="guestCount">0</div></div>
        </div>

        <!-- 支出管理面板 -->
        <div class="expense-panel">
            <div class="expense-header"><span>📋 支出明细</span></div>
            <div id="expenseListContainer"></div>
            <div class="inline-form">
                <input type="text" id="expenseNameInput" class="input" placeholder="项目 (烟酒/酒席...)">
                <input type="number" id="expenseAmountInput" class="input" placeholder="金额" value="0">
                <button id="addExpenseBtn" class="btn btn-primary">记一笔</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead><tr><th>姓名</th><th>关系</th><th>金额</th><th>电话</th><th>备注</th><th></th></tr></thead>
                <tbody id="recordsTbody"><tr><td colspan="6" class="empty-hint">暂无数据，请点击“加载加密数据”或“导入Excel”</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 密码输入弹窗 -->
<div class="modal-overlay" id="passwordModal">
    <div class="modal-card">
        <h3>🔐 输入数据密码</h3>
        <input type="password" id="dataPasswordInput" class="input" placeholder="密码" autofocus style="width:100%; margin:16px 0;">
        <div class="error-msg" id="passwordError">密码错误，请重试</div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn" id="cancelPasswordBtn" style="flex:1">取消</button>
            <button class="btn btn-primary" id="confirmPasswordBtn" style="flex:1">确认</button>
        </div>
    </div>
</div>

<input type="file" id="excelFileInput" accept=".xlsx, .xls">

<script>
    (function(){
        const DATA_FILE_URL = './data.enc';
        
        let appData = { books: [] };
        let currentBookId = null;
        let searchKeyword = '';
        const STORAGE_KEY = 'gift_ledger_full_v1';
        
        const dom = {
            booksContainer: document.getElementById('booksContainer'),
            currentTitle: document.getElementById('currentBookTitle'),
            totalGift: document.getElementById('totalGift'),
            expenseTotal: document.getElementById('expenseTotal'),
            balance: document.getElementById('balance'),
            guestCount: document.getElementById('guestCount'),
            recordsTbody: document.getElementById('recordsTbody'),
            expenseList: document.getElementById('expenseListContainer'),
            searchInput: document.getElementById('searchInput'),
            excelInput: document.getElementById('excelFileInput'),
            passwordModal: document.getElementById('passwordModal'),
            dataPasswordInput: document.getElementById('dataPasswordInput'),
            passwordError: document.getElementById('passwordError')
        };
        
        const utils = {
            generateId: () => Date.now() + '-' + Math.random().toString(36).substr(2,6),
            formatMoney: n => (Number(n)||0).toLocaleString('zh-CN', {minimumFractionDigits:2}),
            escapeHtml: s => String(s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]),
            saveToLocal: () => localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)),
            loadFromLocal: () => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try { appData = JSON.parse(saved); } catch(e){ initEmptyBook(); }
                } else {
                    initEmptyBook();
                }
                if (!currentBookId && appData.books.length) currentBookId = appData.books[0].id;
            }
        };
        
        function initEmptyBook() {
            appData = { books: [{ id: utils.generateId(), name: '默认账本', type: '红事', records: [], expenses: [] }] };
        }
        
        const getCurrentBook = () => appData.books.find(b => b.id === currentBookId);
        
        function renderAll() {
            renderBookList();
            renderCurrentBook();
            utils.saveToLocal();
        }
        
        function renderBookList() {
            let html = '';
            appData.books.forEach(book => {
                const active = book.id === currentBookId;
                html += `<div class="book-item ${active ? 'active' : ''}" data-book-id="${book.id}">
                    <span>${utils.escapeHtml(book.name)} (${book.records.length})</span>
                    <span class="book-actions"><button data-delete-id="${book.id}" style="font-size:1.2rem;">🗑️</button></span>
                </div>`;
            });
            dom.booksContainer.innerHTML = html;
        }
        
        function renderCurrentBook() {
            const book = getCurrentBook();
            if (!book) return;
            dom.currentTitle.textContent = book.name;
            
            let records = book.records;
            const kw = searchKeyword.trim().toLowerCase();
            if (kw) records = records.filter(r => r.name.toLowerCase().includes(kw));
            
            const giftTotal = book.records.reduce((s, r) => s + (Number(r.amount)||0), 0);
            const expTotal = (book.expenses || []).reduce((s, e) => s + (Number(e.amount)||0), 0);
            dom.totalGift.textContent = utils.formatMoney(giftTotal);
            dom.expenseTotal.textContent = utils.formatMoney(expTotal);
            dom.balance.textContent = utils.formatMoney(giftTotal - expTotal);
            dom.guestCount.textContent = book.records.length;
            
            // 渲染支出
            const expenses = book.expenses || [];
            if (expenses.length === 0) {
                dom.expenseList.innerHTML = '<div style="text-align:center; color:#999; padding:10px;">暂无支出</div>';
            } else {
                dom.expenseList.innerHTML = expenses.map(e => `
                    <div class="expense-row">
                        <span>${utils.escapeHtml(e.name)}</span>
                        <span style="font-weight:700;">¥${utils.formatMoney(e.amount)}</span>
                        <button class="btn" style="padding:2px 8px;" data-del-exp-id="${e.id}">✕</button>
                    </div>
                `).join('');
            }
            
            if (records.length === 0) {
                dom.recordsTbody.innerHTML = `<tr><td colspan="6" class="empty-hint">暂无礼金记录</td></tr>`;
                return;
            }
            dom.recordsTbody.innerHTML = records.map(r => `
                <tr>
                    <td>${utils.escapeHtml(r.name)}</td>
                    <td>${utils.escapeHtml(r.relation) || '—'}</td>
                    <td>¥${utils.formatMoney(r.amount)}</td>
                    <td>${utils.escapeHtml(r.contact) || '—'}</td>
                    <td>${utils.escapeHtml(r.note) || '—'}</td>
                    <td><button class="btn" style="padding:2px 8px;" data-edit-id="${r.id}">编辑</button></td>
                </tr>
            `).join('');
        }
        
        // 加载加密数据
        async function loadEncryptedData(password) {
            try {
                const response = await fetch(DATA_FILE_URL);
                if (!response.ok) throw new Error('数据文件不存在');
                let encryptedText = await response.text();
                encryptedText = encryptedText.trim().replace(/^\uFEFF/, ''); // 去除BOM
                
                const bytes = CryptoJS.AES.decrypt(encryptedText, password);
                const jsonStr = bytes.toString(CryptoJS.enc.Utf8);
                if (!jsonStr) throw new Error('密码错误');
                
                const decrypted = JSON.parse(jsonStr);
                if (!decrypted.books) throw new Error('数据格式错误');
                
                // 合并或替换
                appData = decrypted;
                appData.books.forEach(book => {
                    if (!book.expenses) book.expenses = [];
                });
                currentBookId = appData.books[0].id;
                utils.saveToLocal();
                renderAll();
                dom.passwordModal.style.display = 'none';
            } catch (e) {
                dom.passwordError.style.display = 'block';
                console.error('解密失败:', e);
            }
        }
        
        // 导入Excel到当前账本
        function importExcelFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const wb = XLSX.read(e.target.result, {type: 'binary'});
                const sheet = wb.Sheets[wb.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, {header: 1});
                const book = getCurrentBook();
                let cnt = 0;
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i]; if (!row) continue;
                    const addr = (row[0] || '').toString().trim();
                    const name = (row[1] || '').toString().trim();
                    if (!name) continue;
                    const amount = parseFloat(row[2]) || 0;
                    const note = (row[3] || '').toString().trim();
                    book.records.push({
                        id: utils.generateId(), name, relation: '', amount, contact: '',
                        note: addr + (note ? ' | ' + note : '')
                    });
                    cnt++;
                }
                alert(`已导入 ${cnt} 条记录`);
                renderAll();
            };
            reader.readAsBinaryString(file);
        }
        
        // 事件绑定
        function bindEvents() {
            document.getElementById('loadEncryptedBtn').addEventListener('click', () => {
                dom.dataPasswordInput.value = '';
                dom.passwordError.style.display = 'none';
                dom.passwordModal.style.display = 'flex';
                dom.dataPasswordInput.focus();
            });
            document.getElementById('confirmPasswordBtn').addEventListener('click', () => {
                const pwd = dom.dataPasswordInput.value.trim();
                if (pwd) loadEncryptedData(pwd);
            });
            document.getElementById('cancelPasswordBtn').addEventListener('click', () => dom.passwordModal.style.display = 'none');
            dom.dataPasswordInput.addEventListener('keypress', e => { if(e.key==='Enter') document.getElementById('confirmPasswordBtn').click(); });
            dom.passwordModal.addEventListener('click', e => { if(e.target===dom.passwordModal) dom.passwordModal.style.display='none'; });
            
            document.getElementById('importExcelBtn').addEventListener('click', () => dom.excelInput.click());
            dom.excelInput.addEventListener('change', e => {
                const file = e.target.files[0];
                if (file) importExcelFile(file);
                dom.excelInput.value = '';
            });
            
            dom.booksContainer.addEventListener('click', e => {
                const delBtn = e.target.closest('[data-delete-id]');
                if (delBtn) {
                    const id = delBtn.dataset.deleteId;
                    if (appData.books.length <= 1) return alert('至少保留一个账本');
                    if (confirm('确定删除此账本？')) {
                        appData.books = appData.books.filter(b => b.id !== id);
                        if (currentBookId === id) currentBookId = appData.books[0].id;
                        renderAll();
                    }
                    return;
                }
                const item = e.target.closest('.book-item');
                if (item) {
                    currentBookId = item.dataset.bookId;
                    renderAll();
                }
            });
            
            document.getElementById('newBookBtn').addEventListener('click', () => {
                const name = prompt('账本名称');
                if (!name) return;
                const newBook = { id: utils.generateId(), name, type: '红事', records: [], expenses: [] };
                appData.books.push(newBook);
                currentBookId = newBook.id;
                renderAll();
            });
            
            dom.searchInput.addEventListener('input', e => { searchKeyword = e.target.value; renderCurrentBook(); });
            
            document.getElementById('exportExcelBtn').addEventListener('click', () => {
                const book = getCurrentBook();
                const data = [['姓名','关系','金额','电话','备注']];
                book.records.forEach(r => data.push([r.name, r.relation, r.amount, r.contact, r.note]));
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), book.name);
                XLSX.writeFile(wb, `${book.name}.xlsx`);
            });
            
            document.getElementById('analysisBtn').addEventListener('click', () => {
                const book = getCurrentBook();
                const amounts = book.records.map(r => Number(r.amount)||0);
                if (!amounts.length) return alert('暂无数据');
                const max = Math.max(...amounts);
                const min = Math.min(...amounts);
                const total = amounts.reduce((a,b)=>a+b,0);
                alert(`总礼金: ¥${utils.formatMoney(total)}\n最高: ¥${max}\n最低: ¥${min}\n宾客数: ${book.records.length}`);
            });
            
            document.getElementById('showAddFormBtn').addEventListener('click', () => {
                const name = prompt('姓名'); if (!name) return;
                const amount = parseFloat(prompt('金额')) || 0;
                const book = getCurrentBook();
                book.records.push({ id: utils.generateId(), name, relation: '', amount, contact: '', note: '' });
                renderAll();
            });
            
            // 支出相关
            document.getElementById('addExpenseBtn').addEventListener('click', () => {
                const book = getCurrentBook();
                const name = document.getElementById('expenseNameInput').value.trim();
                const amount = parseFloat(document.getElementById('expenseAmountInput').value);
                if (!name) return alert('请输入支出项目');
                if (isNaN(amount)) return alert('金额无效');
                book.expenses = book.expenses || [];
                book.expenses.push({ id: utils.generateId(), name, amount });
                document.getElementById('expenseNameInput').value = '';
                document.getElementById('expenseAmountInput').value = '0';
                renderAll();
            });
            
            dom.expenseList.addEventListener('click', e => {
                const btn = e.target.closest('[data-del-exp-id]');
                if (!btn) return;
                const book = getCurrentBook();
                book.expenses = book.expenses.filter(ex => ex.id !== btn.dataset.delExpId);
                renderAll();
            });
            
            dom.recordsTbody.addEventListener('click', e => {
                const btn = e.target.closest('[data-edit-id]');
                if (!btn) return;
                const book = getCurrentBook();
                const rec = book.records.find(r => r.id === btn.dataset.editId);
                if (!rec) return;
                const newName = prompt('姓名', rec.name);
                if (newName !== null) rec.name = newName;
                const newAmount = parseFloat(prompt('金额', rec.amount));
                if (!isNaN(newAmount)) rec.amount = newAmount;
                renderAll();
            });
        }
        
        utils.loadFromLocal();
        bindEvents();
        renderAll();
    })();
</script>
</body>
</html>
